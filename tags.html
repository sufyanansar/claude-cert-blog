---
layout: default
title: Tags
permalink: /tags/
---
<h1>Tags</h1>
{% assign tags = site.tags | sort %}
{% for t in tags %}
<h2 id="{{ t[0] | slugify }}">#{{ t[0] }}</h2>
<ul>
  {% for p in t[1] %}<li><a href="{{ p.url | relative_url }}">{{ p.title }}</a> <small>{{ p.date | date: "%b %-d, %Y" }}</small></li>{% endfor %}
</ul>
{% endfor %}
