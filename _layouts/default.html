<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site"><div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">✳ {{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Posts</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
      <a href="{{ '/team/' | relative_url }}">Team</a>
      <a href="{{ '/write/' | relative_url }}" class="btn">Submit a post</a>
    </nav>
  </div></header>
  <main class="wrap">{{ content }}</main>
  <footer class="wrap">{{ site.description }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
</body>
</html>
